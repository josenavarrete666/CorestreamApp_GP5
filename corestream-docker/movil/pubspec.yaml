name: corestream_mobile
description: App móvil de CoreStream — seguimiento de proyectos, tickets, incidencias y notificaciones.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # Gestión de estado
  flutter_riverpod: ^2.5.1
  # Cliente HTTP para el backend FastAPI (modo API real)
  dio: ^5.4.3
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  web_socket_channel: ^3.0.3
  web: ^1.1.1
  # Persistencia ligera de preferencias (tema, idioma, modo)
  shared_preferences: ^2.2.3

  # Push reales (desactivado por defecto; ver lib/services/push_service.dart
  # y README «Activar Firebase»). Descomentar al ejecutar `flutterfire configure`:
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
