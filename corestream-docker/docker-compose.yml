name: corestream-docker

x-backend: &backend
  image: corestream-docker-backend:dev
  build:
    context: ./backend
    args:
      INSTALL_DEV_DEPS: "true"
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-corestream}:${POSTGRES_PASSWORD:?Ejecutar scripts/init-env.ps1}@postgres:5432/${POSTGRES_DB:-corestream}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?Ejecutar scripts/init-env.ps1}
    ENVIRONMENT: development
    DEBUG: "true"
    LOG_LEVEL: info
    STORAGE_BACKEND: local
    UPLOAD_DIR: /app/storage
    ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-7358},http://127.0.0.1:${WEB_PORT:-7358}
    TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-corestream}:${POSTGRES_PASSWORD:?Ejecutar scripts/init-env.ps1}@postgres:5432/corestream_test
    TEST_REDIS_URL: redis://redis:6379/15

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corestream}
      POSTGRES_USER: ${POSTGRES_USER:-corestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecutar scripts/init-env.ps1}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8080"
    volumes:
      - ./backend:/app
      - storage-data:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
